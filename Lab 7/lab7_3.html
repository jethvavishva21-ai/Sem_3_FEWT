<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Scientific Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .calc-box {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            background: #2c3e50;
            width: 320px;
        }

        #display {
            width: 100%;
            height: 40px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        button {
            padding: 15px 10px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #34495e;
            border-radius: 5px;
            background: #ecf0f1;
        }

        button:hover {
            background: #bdc3c7;
        }

        .clear {
            grid-column: span 5;
            background: #e74c3c;
            color: white;
            border: none;
        }

        .clear:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>
    <div class="calc-box">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button onclick="calcMath('sin')">sin</button>
            <button onclick="calcMath('cos')">cos</button>
            <button onclick="calcMath('tan')">tan</button>
            <button onclick="appendValue('**')">x^y</button>
            <button onclick="calcMath('sqrt')">√</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('/')">/</button>
            <button onclick="appendValue('(')">(</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('*')">*</button>
            <button onclick="appendValue(')')">)</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('-')">-</button>
            <button onclick="calculate()">=</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="appendValue('+')">+</button>
            <button class="clear" onclick="clearDisplay()">Clear</button>
        </div>
    </div>

    <script>
        function appendValue(val) {
            document.getElementById('display').value += val;
        }
        function clearDisplay() {
            document.getElementById('display').value = '';
        }
        function calcMath(func) {
            let val = document.getElementById('display').value;
            if (val === '') return;
            try {
                let num = eval(val);
                if (func === 'sin') document.getElementById('display').value = Math.sin(num);
                if (func === 'cos') document.getElementById('display').value = Math.cos(num);
                if (func === 'tan') document.getElementById('display').value = Math.tan(num);
                if (func === 'sqrt') document.getElementById('display').value = Math.sqrt(num);
            } catch (e) {
                alert("Invalid Expression");
                clearDisplay();
            }
        }
        function calculate() {
            try {
                let result = eval(document.getElementById('display').value);
                document.getElementById('display').value = result;
            } catch (e) {
                alert("Invalid Expression");
                clearDisplay();
            }
        }
    </script>
</body>

</html>
