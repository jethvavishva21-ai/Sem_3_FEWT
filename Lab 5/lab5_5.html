<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = ['flower','glow','magic']

        word = prompt("Enter a word to search");

        let index = -1;

        for(i = 0; i <a.length; i++)
        {
            if(a[i] == word)
            {
                index = i;
                break;
            }
        }

        if (index != -1) 
        {
            document.write("Word Index : " + index);
        } 
        
        else 
        {
            document.write("Word not found in array!");
        }
        
    </script>
</body>
</html>
