<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!-- 4. WAP to read an array from the user and sort them using quick sort. (B) -->
<script>
    function quickSort(arr) {
        if (arr.length <= 1) {
            return arr;
        }

        let pivot = arr[arr.length - 1];
        let left = [];
        let right = [];

        for (let i = 0; i < arr.length - 1; i++) {
            if (arr[i] < pivot) {
                left.push(arr[i]);
            } else {
                right.push(arr[i]);
            }
        }

        return [...quickSort(left), pivot, ...quickSort(right)];
    }

    let n = parseInt(prompt("Enter number of elements:"));
    let a = [];

    for (let i = 0; i < n; i++) {
        a[i] = parseInt(prompt("Enter Element : "));
    }

    document.write("Original Array: " + a.join(", ") + "<br/><br/>");

    let sortedArray = quickSort(a);

    document.write("Sorted Array (Quick Sort): " + sortedArray.join(", "));
</script>
</body>
</html>
