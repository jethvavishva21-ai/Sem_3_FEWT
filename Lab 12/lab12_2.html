<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--2. write a jQuery to slideup, slidedown and slidetoggle image. (A)!-->

    <script src="
    https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js">
    </script>

    <img id="img" src="image.18.jpeg" height="100px">

    <br><br>
    
    <button id="btn1">Slide UP</button>
    <button id="btn2">Slide Down</button>
    <button id="btn3">Slide Toggle</button>

    <script>
        $("#btn1").click(() => {
            $("#img").slideUp();
        });

        $("#btn2").click(()=>{
            $("#img").slideDown();
        });

        $("#btn3").click(() => {
            $("#img").slideToggle();
        });
    </script>

</body>

</html>
