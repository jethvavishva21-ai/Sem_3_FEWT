<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script src="
        https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js">
        </script>

<body>
    <!--8. write a jQuery to hide all siblings when clicked on a button. (A)-->

    <ul id="mylist">
        <li>Apple</li>
        <li id="list2">Orange</li>
        <li>Kiwi</li>
    </ul>

    <button id="btn">Hide Siblings</button>

    <script>
        $("#btn").click(() => {
            $("#list2").siblings().hide();
        })
    </script>
</body>

</html>
