<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--1. write a jQuery to fade object when clicked on it. (A)!-->

    
    <script src="
    https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js">
    </script>
 
    <h2 id="myTxt">This Is h2 Tag</h2>
    <button id="btn1">click</button>

    <script>
        $("#btn1").click(()=>{
            $("#myTxt").fadeOut();
        });
    </script>

</body>
</html>
