<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
        <script src="
        https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js">
        </script>
<body>
    <!--5. write a jQuery program to append new list item with "Hello World" to existing unordered list when clicked on button. (A)-->

    <ul id="mylist">
        <li>Hello</li>
        <li>Hii</li>
    </ul>

    <button id="btn">Append</button>

    <script>
        $("#btn").click(()=>{
            $("#mylist").append("<li>Hello World</li>");
        })
    </script>
</body>
</html>
