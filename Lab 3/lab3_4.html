<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        n = parseInt(prompt("Enter number : "));

        a = 0, b = 1, temp = 0,result = "";

        for(i = 1 ; i<=n; i++)
        {
            result+=a

            if(i!==n)
            {
                result += ", ";
            }

            temp = a + b;
            a = b;
            b = temp;
        }

        document.write(result);

    </script>
</body>
</html>
