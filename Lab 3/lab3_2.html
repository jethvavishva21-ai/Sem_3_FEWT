<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        n = parseInt(prompt("Enter Number : "));

        isPrime = false;

        if(n <= 1)
        {
            document.write("Not Prime Number");
        }

        else
        {
            for(i = 2; i < n/2; i++)
            {
                if(n % i == 0)
                {
                    isPrime = true;
                    break;
                }
            }
        }

        if(!isPrime)
        {
            document.write(n + "is prime number");
        }

        else
        {
            document.write(n + "is not prime number");
        }
    </script>
</body>
</html>
