<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #1e293b;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        transition: background-color 0.3s ease;
    }

    .card {
        background: rgba(15, 23, 42, 0.9);
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        text-align: center;
        width: 380px;
    }

    input {
        width: 90%;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid #38bdf8;
        background: #1e293b;
        color: white;
        text-align: center;
        outline: none;
        margin-bottom: 20px;
    }

    .info-box {
        background: #334155;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        font-size: 18px;
    }

    .vowel-msg {
        color: #4ade80;
        font-weight: bold;
        font-size: 20px;
        min-height: 28px;
    }
    </style>
</head>

<body>

    <div class="card">
        <h2>Key & Vowel Detector</h2>
        <input type="text" id="keyBox" placeholder="અહીં કોઈપણ Key દબાવો..." autocomplete="off">

        <div class="info-box" id="codeDisplay">Press any key to see KeyCode</div>
        <div class="vowel-msg" id="vowelDisplay"></div>
    </div>

    <script>
        const keyBox = document.getElementById("keyBox");
        const codeDisplay = document.getElementById("codeDisplay");
        const vowelDisplay = document.getElementById("vowelDisplay");

        // Condition 1 & 2: Key Pressed (keydown) -> Show KeyCode & Check Vowel
        keyBox.addEventListener("keydown", (e) => {
            document.body.style.backgroundColor = "#1e293b"; // Reset background while pressing

            let key = e.key.toLowerCase();
            let keyCode = e.keyCode || e.which;

            // Show Key Code
            codeDisplay.innerHTML = `Key Pressed: <b>${e.key}</b> | Key Code: <b>${keyCode}</b>`;

            // Check if Vowel (a, e, i, o, u)
            if (['a', 'e', 'i', 'o', 'u'].includes(key)) {
                vowelDisplay.innerHTML = `🎉 Vowel "${e.key}" is pressed!`;
            } else {
                vowelDisplay.innerHTML = "";
            }
        });

        // Condition 3: When key is released (keyup) -> Background turns Blue
        keyBox.addEventListener("keyup", () => {
            document.body.style.backgroundColor = "blue";
        });
    </script>
</body>
</html>
