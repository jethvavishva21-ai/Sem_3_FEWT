<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<!--1
    0 1
    1 0 1
    0 1 0 1 -->
    <script>
          n = parseInt(prompt("Enter number "));

            for (i = 1; i <= n; i++) 
            {
                for (j = 1; j <= i; j++) 
                {
                    if(i % 2 == 0)
                    {
                        if(j % 2 == 0)
                        {
                            document.write("1");
                        }

                        else
                        {
                            document.write("0");
                        }
                    }

                    else
                    {
                        if (j % 2 == 0) 
                        {
                            document.write("0");
                        }

                        else 
                        {
                            document.write("1");
                        }
                    }
                }

                document.write("<br/>");
            }
    </script>
</body>
</html>
