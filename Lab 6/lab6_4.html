<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- 4. WAP to display products stored in array. (B) -->

    <script>
        productlist = [{ name: 'Cosmetic' }, { name: 'Nailpolish' }, { name: 'Dryer' }]

        document.write("Product List : " + "<br/>");

            for (i = 0; i < productlist.length; i++) 
            {
                document.write(productlist[i].name + "<br/>");
            }
    </script>
</body>
</html>
